name: Deploy to main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [closed]

jobs:
  deploy:
    # This logic ensures the job only runs on a push OR a successful merge
    if: github.event_name == 'push' || (github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Executing remote ssh commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 198.54.115.205
          username: kingntxc
          port: 21098
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -euo pipefail
            trap 'echo "Deployment stopped: a command failed before seeders could run."' ERR
            cd portal.kingsvtu.ng/kingso
            git stash
            git pull origin main
            # composer update
            php artisan migrate --force
            rm -rf ../modern-assets && cp -r public/modern-assets ../modern-assets
            php artisan optimize:clear
            echo "Deployment to Server completed!"
